<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gestão - Portal Corporativo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script>
        (function() {
            var theme = localStorage.getItem('nexus_theme');
            if (theme === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .dark .glass-effect { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
        .hidden-input { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const STORAGE_KEY_LOGO = "nexus_corporate_custom_logo_v2";
        const STORAGE_KEY_THEME = "nexus_theme";
        const DEFAULT_LOGO_URL = "https://raw.githubusercontent.com/RobertsonSales/portal_de_analises/main/Grupo_Labmedic%20_fundo_transparente.png";

        const Icons = {
            LayoutGrid: ({ size = 24, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                </svg>
            ),
            ArrowRight: ({ size = 24, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                </svg>
            ),
            Sparkles: ({ size = 24, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                </svg>
            ),
            ExternalLink: ({ size = 24, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
            ),
            Upload: ({ size = 16, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            ),
            Sun: ({ size = 24, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
                </svg>
            ),
            Moon: ({ size = 24, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
            )
        };

        const { useState, useEffect } = React;

        const applications = [
            { id: 4, title: "Pesquisa de Riscos", url: "https://pesquisa-semanal.vercel.app/", image: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&q=80&w=2940&h=1960&crop=entropy&cs=tinysrgb", gradient: "from-rose-400 to-pink-600", shadowColor: "shadow-rose-500/40", category: "RISCO TRIBUTÁRIO E TRABALHISTA", insight: "Verifique nos portais tributário, trabalhista e de emissão de NFS-e Carioca, se existem impedimentos legais - Sem base de dados local." },
            { id: 7, title: "Cálculo de Rescisões e Férias PJ", url: "https://rct-pj.vercel.app/", image: "https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&q=80&w=800", gradient: "from-teal-400 to-sky-600", shadowColor: "shadow-teal-500/40", category: "RESCISÕES E FÉRIAS PJ", insight: "Calcule com precisão rescisões contratuais e férias para prestadores de serviços Pessoa Jurídica - Sem base de dados local." },
            { id: 8, title: "Cálculo de Férias CLT", url: "https://ferias-clt.vercel.app/", image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=800", gradient: "from-fuchsia-400 to-pink-600", shadowColor: "shadow-fuchsia-500/40", category: "FÉRIAS CLT", insight: "Automatize o cálculo de férias de colaboradores CLT, com abono, 1/3 constitucional e encargos - Sem base de dados local." },
            { id: 11, title: "Faturamento - FIP – Blessing", url: "https://faturamento-mensal-blessing.vercel.app/", image: "https://images.unsplash.com/photo-1649209979970-f01d950cc5ed?auto=format&fit=crop&q=80&w=800", gradient: "from-amber-400 to-yellow-600", shadowColor: "shadow-amber-500/40", category: "FATURAMENTO MENSAL – BLESSING", insight: "Acompanhe o faturamento mensal do cliente FIP - Blessing, com visão detalhada dos valores faturados por período - Base de dados local => Planilha Mensal FIP" },
            { id: 12, title: "Emissão de Notas de Débito", url: "https://nota-debito-pearl.vercel.app/", image: "https://images.unsplash.com/photo-1686581639043-893261d6b43f?auto=format&fit=crop&q=80&w=800", gradient: "from-violet-500 to-fuchsia-700", shadowColor: "shadow-violet-500/40", category: "NOTAS DE DÉBITO", insight: "Emita e gerencie notas de débito de forma rápida e padronizada para cobranças adicionais - Sem base de dados local." },
            { id: 2, title: "Gestão de Patrimônio", url: "https://patrimonio-ten.vercel.app/", image: "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=800", gradient: "from-emerald-400 to-green-600", shadowColor: "shadow-emerald-500/40", category: "GESTÃO DO PARQUE DE EQUIPAMENTOS", insight: "Monitore a localização e valorize o capital físico da sua empresa - Base de dados local => Regiões e Patrimônios.xlsx." },
            { id: 1, title: "Análise de Custos - DT", url: "https://custo-dt.vercel.app/", image: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&q=80&w=800", gradient: "from-cyan-400 to-blue-600", shadowColor: "shadow-cyan-500/40", category: "CUSTO DAS DILIGÊNCIAS TÉCNICAS", insight: "Gerencie os custos das diligências técnicas realizadas por período, cliente, técnicos e unidades assistidas - Base de dados local => Diligências Técnicas - Análise de Custos.xlsx." },
            { id: 5, title: "Análise de OS para cobrança", url: "https://analise-os.vercel.app/", image: "https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&q=80&w=800", gradient: "from-orange-400 to-amber-600", shadowColor: "shadow-orange-500/40", category: "ORDENS DE SERVIÇO COM TROCA DE PEÇAS", insight: "Analise as Ordens de Serviço que relatam a troca de peças dos equipamentos durante a assistência técnica - Base de dados local => Tarefas - Anállise OS - Cobrança.xlsx." },
            { id: 3, title: "Análise de Receitas e Despesas", url: "https://fluxo-de-caixa-2pux.vercel.app/", image: "https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?auto=format&fit=crop&q=80&w=800", gradient: "from-purple-400 to-violet-600", shadowColor: "shadow-purple-500/40", category: "SAÚDE FINANCEIRA", insight: "Visualize entradas e saídas de capital e do Fluxo de Caixa para tomar decisões precisas - Base de dados local => Base para análises.xlsx." },
            { id: 6, title: "Análise de Lucratividade", url: "https://analiselucratividade.vercel.app/", image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=800", gradient: "from-blue-500 to-indigo-600", shadowColor: "shadow-indigo-500/40", category: "MARGENS DE LUCRO POR CLIENTE", insight: "Descubra quais clientes realmente impulsionam seu negócio e ampliam sua margem de lucro - Base de dados local => Base para análises.xlsx." },
            { id: 9, title: "Fluxo de Caixa por Período", url: "https://fluxo-de-caixa-ii.vercel.app/", image: "https://images.unsplash.com/photo-1554224154-26032ffc0d07?auto=format&fit=crop&q=80&w=800", gradient: "from-lime-400 to-emerald-600", shadowColor: "shadow-lime-500/40", category: "FLUXO DE CAIXA POR PERÍODO", insight: "Acompanhe o fluxo de caixa consolidado por período selecionado, com visão analítica e comparativa - Base de dados local => Base para análises.xlsx." },
            { id: 10, title: "Faturamento Segmentado - Hospitalar", url: "https://analise-insumos-labmedic.vercel.app/", image: "https://images.unsplash.com/photo-1708449903767-c4e97772c26e?auto=format&fit=crop&q=80&w=800", gradient: "from-red-400 to-rose-600", shadowColor: "shadow-red-500/40", category: "FATURAMENTO SEGMENTADO – ÁREA HOSPITALAR", insight: "Analise o faturamento segmentado de insumos e aluguéis de equipamentos da área hospitalar, identificando padrões de consumo e oportunidades de cobrança - Base de dados local => Base para análises.xlsx." },
            { id: 13, title: "Deprecia\u00e7\u00e3o de Ativos", url: "https://equip-deprec.vercel.app/", image: "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=800", gradient: "from-slate-400 to-slate-600", shadowColor: "shadow-slate-500/40", category: "DEPRECIA\u00c7\u00c3O DO IMOBILIZADO", insight: "Calcule e acompanhe a deprecia\u00e7\u00e3o dos ativos do imobilizado, com vis\u00e3o do valor cont\u00e1bil atualizado dos equipamentos - Base de dados local => Base para an\u00e1lises.xlsx." }
        ];

        const renderInsight = (insight, gradient) => {
            // Caso 1: possui base de dados local => destaca o nome do arquivo .xlsx
            const localDbMatch = insight.match(/^(.*?)-\s*Base de dados local\s*=>\s*(.+?)\.?\s*$/i);
            if (localDbMatch) {
                const prefix = localDbMatch[1].trim();
                const dbName = localDbMatch[2].replace(/\.$/, '').trim();
                return (
                    <>
                        <span>{prefix}</span>
                        <span className="block mt-3">
                            <span className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
                                Base de dados local
                            </span>
                            <span className={`relative block rounded-lg overflow-hidden bg-slate-50 dark:bg-slate-900/50 border border-slate-200/70 dark:border-slate-700/70`}>
                                <span className={`absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b ${gradient}`}></span>
                                <span className={`block pl-3 pr-3 py-2 text-xs font-bold bg-gradient-to-r ${gradient} bg-clip-text text-transparent break-words`} style={{ WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                                    {dbName}
                                </span>
                            </span>
                        </span>
                    </>
                );
            }
            // Caso 2: sem base de dados local => rótulo neutro
            const noDbMatch = insight.match(/^(.*?)-\s*Sem base de dados local\.?\s*$/i);
            if (noDbMatch) {
                const prefix = noDbMatch[1].trim();
                return (
                    <>
                        <span>{prefix}</span>
                        <span className="block mt-3">
                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider bg-slate-100 text-slate-500 dark:bg-slate-700/60 dark:text-slate-400 border border-slate-200 dark:border-slate-600">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                                Sem base de dados local
                            </span>
                        </span>
                    </>
                );
            }
            return insight;
        };

        const AppCard = ({ app }) => {
            const [isHovered, setIsHovered] = useState(false);
            return (
                <div className={`group relative bg-white dark:bg-slate-800 rounded-3xl overflow-hidden cursor-pointer transition-all duration-500 h-full flex flex-col hover:-translate-y-2 hover:shadow-2xl ${isHovered ? app.shadowColor : 'shadow-slate-200 dark:shadow-slate-900/40'} border border-slate-100 dark:border-slate-700`}
                     onMouseEnter={() => setIsHovered(true)} onMouseLeave={() => setIsHovered(false)}
                     onClick={() => window.open(app.url, '_blank', 'noopener,noreferrer')}>
                    <div className="relative h-36 overflow-hidden">
                        <div className="absolute inset-0 bg-slate-900/10 group-hover:bg-slate-900/0 dark:bg-slate-900/30 dark:group-hover:bg-slate-900/0 transition-colors z-10"></div>
                        <img src={app.image} alt={app.title} loading="lazy" className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"/>
                        <div className={`absolute top-3 left-3 z-20 px-2.5 py-0.5 rounded-full text-[10px] font-bold text-white uppercase tracking-wide bg-gradient-to-r ${app.gradient} shadow-lg backdrop-blur-sm`}>
                            {app.category}
                        </div>
                    </div>
                    <div className="p-4 sm:p-5 flex flex-col flex-grow">
                        <div className="flex justify-between items-start mb-2">
                            <h3 className={`text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r ${app.gradient} transition-all duration-300`}>{app.title}</h3>
                            <Icons.ExternalLink size={16} className="text-slate-300 group-hover:text-slate-600 dark:text-slate-600 dark:group-hover:text-slate-300 transition-colors shrink-0 mt-0.5" />
                        </div>
                        <div className="text-slate-500 dark:text-slate-400 text-xs sm:text-sm leading-relaxed mb-4 font-medium">{renderInsight(app.insight, app.gradient)}</div>
                        <div className="mt-auto pt-3 border-t border-slate-50 dark:border-slate-700">
                            <button className={`w-full py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all ${isHovered ? `bg-gradient-to-r ${app.gradient} text-white shadow-lg scale-[1.02]` : 'bg-slate-50 text-slate-600 hover:bg-slate-100 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600'}`}>
                                Acessar Módulo <Icons.ArrowRight size={14} className={`transition-transform ${isHovered ? 'translate-x-1' : ''}`} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [logo, setLogo] = useState(DEFAULT_LOGO_URL);
            const [isDragging, setIsDragging] = useState(false);
            const [theme, setTheme] = useState(() => localStorage.getItem(STORAGE_KEY_THEME) || 'light');

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY_LOGO);
                if (saved && saved.length < 600 * 1024) setLogo(saved);
                else if (saved) localStorage.removeItem(STORAGE_KEY_LOGO);
            }, []);

            useEffect(() => {
                const root = document.documentElement;
                if (theme === 'dark') root.classList.add('dark');
                else root.classList.remove('dark');
                localStorage.setItem(STORAGE_KEY_THEME, theme);
            }, [theme]);

            const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');

            const compressAndResizeImage = (file, cb) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const MAX_W = 800, MAX_H = 400;
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX_W) { h = h * (MAX_W / w); w = MAX_W; }
                        else if (h > MAX_H) { w = w * (MAX_H / h); h = MAX_H; }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        cb(canvas.toDataURL('image/webp', 0.9));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleLogoUpload = file => {
                if (!file || !file.type.startsWith('image/')) return;
                compressAndResizeImage(file, optimized => {
                    localStorage.setItem(STORAGE_KEY_LOGO, optimized);
                    setLogo(optimized);
                });
            };

            const handleDrop = e => { e.preventDefault(); setIsDragging(false); handleLogoUpload(e.dataTransfer.files[0]); };

            return (
                <div className="min-h-screen bg-slate-50 dark:bg-slate-950 overflow-x-hidden font-sans">
                    <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden">
                        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-100 via-slate-50 to-slate-50 dark:from-slate-900 dark:via-slate-950 dark:to-slate-950"></div>
                        <div className="absolute top-[-10%] right-[-5%] w-96 h-96 bg-purple-200/20 dark:bg-purple-900/15 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-blue-200/20 dark:bg-blue-900/15 rounded-full blur-3xl"></div>
                    </div>

                    <header className="sticky top-0 z-50 glass-effect border-b border-slate-200/60 dark:border-slate-700/60 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
                                {/* LOGO PREENCHENDO 100% DO CONTÊINER (EXATAMENTE COMO VOCÊ QUER) */}
                                <div className="relative group shrink-0 w-full max-w-xs sm:w-80 h-24 sm:h-32"
                                     onDragOver={e => {e.preventDefault(); setIsDragging(true);}}
                                     onDragLeave={e => {e.preventDefault(); setIsDragging(false);}}
                                     onDrop={handleDrop}>
                                    <input type="file" id="logo-upload" accept="image/*" className="hidden-input"
                                           onChange={e => handleLogoUpload(e.target.files[0])} />
                                    <label htmlFor="logo-upload" className={`
                                        block w-full h-full bg-white dark:bg-slate-800 rounded-2xl shadow-lg border-4 border-white dark:border-slate-700
                                        cursor-pointer overflow-hidden relative
                                        transition-all duration-300 hover:shadow-xl
                                        ${isDragging ? 'ring-4 ring-indigo-400 ring-opacity-60' : ''}
                                    `}>
                                        {logo ? (
                                            /* IMAGEM PREENCHE TODO O ESPAÇO */
                                            <img 
                                                src={logo} 
                                                alt="Logo Grupo Labmedic" 
                                                className="w-full h-full object-contain rounded-2xl"
                                                loading="lazy"
                                                onError={(e) => { e.target.onerror = null; e.target.src = DEFAULT_LOGO_URL; }}
                                            />
                                        ) : (
                                            <div className="w-full h-full bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center rounded-2xl">
                                                <Icons.LayoutGrid size={48} className="text-white opacity-90" />
                                            </div>
                                        )}
                                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm rounded-2xl">
                                            <div className="text-center text-white">
                                                <Icons.Upload size={32} className="mx-auto mb-2" />
                                                <div className="font-bold text-sm">Alterar Logo</div>
                                            </div>
                                        </div>
                                    </label>
                                </div>

                                <div className="text-center sm:text-left">
                                    <h1 className="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-violet-700 dark:from-indigo-400 dark:to-violet-400 tracking-tight">
                                        Informações Gerenciais para Aumentar Seu Poder de Decisão
                                    </h1>
                                    <p className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest">
                                        Portal de ferramentas para análises
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                <div className="hidden sm:flex items-center gap-2 px-4 py-1.5 bg-indigo-50 dark:bg-indigo-950/50 rounded-full border border-indigo-100 dark:border-indigo-800 shadow-sm">
                                    <Icons.Sparkles size={14} className="text-indigo-600 dark:text-indigo-400 fill-indigo-600 dark:fill-indigo-400" />
                                    <span className="text-xs font-bold text-indigo-800 dark:text-indigo-300">Ambiente Seguro</span>
                                </div>
                                <button
                                    onClick={toggleTheme}
                                    className="p-2.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-amber-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all duration-300 shadow-md border border-slate-200 dark:border-slate-700"
                                    aria-label="Alternar tema claro/escuro"
                                    title="Alternar tema"
                                >
                                    {theme === 'light' ? <Icons.Moon size={20} /> : <Icons.Sun size={20} />}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="relative z-10 max-w-[1400px] mx-auto px-4 py-10">
                        <div className="mb-10 text-center max-w-3xl mx-auto">
                            <h2 className="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-slate-100 mb-4 tracking-tight">
                                Painel de <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400">Módulos Gerenciais</span>
                            </h2>
                            <p className="text-base sm:text-lg text-slate-500 dark:text-slate-400 leading-relaxed">
                                Selecione uma ferramenta abaixo. Cada módulo é carregado independentemente para a máxima performance.
                            </p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 sm:gap-6">
                            {applications.map(app => <AppCard key={app.id} app={app} />)}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="relative z-10 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 py-10 mt-auto">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
                            <p className="text-slate-400 dark:text-slate-500 text-sm font-medium">
                                © {new Date().getFullYear()} Nexus Suite. Excelência em Análises.
                            </p>
                            <div className="flex gap-6 text-sm text-slate-500 dark:text-slate-400 font-medium">
                                <span className="cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Suporte</span>
                                <span className="cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Privacidade</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
